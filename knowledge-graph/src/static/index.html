<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="电商智能客服系统">
        <title>电商智能客服</title>
        <link rel="stylesheet" href="/static/web.css">
    </head>
    <body>
        <div id="dialog-area">
            <div class="bot-message message-bubble">您好！我是电商智能客服，请问有什么需要我帮忙的？</div>
        </div>
        <div class="input-box">
            <label for="user-input"></label>
            <textarea id="user-input" placeholder="需要我做什么？（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
            <button id="send-btn">发送</button>
        </div>
        <script src="/static/marked.min.js"></script>
        <script src="/static/purify.min.js"></script>
        <script src="/static/web.js"></script>
    </body>
</html>
